[package]
name = "nbstool-fig"
version = "0.1.0"
edition = "2024"
publish = false
description = "v3 map figures (application/utils/geos/v3/maps.py) drawn without matplotlib"

[dependencies]
nbstool-geo = { path = "../geo" }
gdal = "0.18"
gdal-sys = "0.11"
tiny-skia = "0.11"
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1"
sha2 = "0.10"


[workspace]
