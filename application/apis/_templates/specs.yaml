        Data precedence per field: this request's payload, then the stored
        draft (see `/documents/feasibility/v3/form`), then the analyser
        prefill. Generating from a PARTIAL form is allowed by design -- any
        template tag with no value renders as its literal bracket text (for
        example `[User input: Telephone]`), visible in the output for manual
        fill.

        The generated file is uploaded to storage and registered as a
        `FeasibilityV3` document; download it through
        `/documents/download/docx` with the returned `document_id`.
      operationId: generateFeasibilityV3
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
