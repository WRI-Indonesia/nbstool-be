      operationId: getPathway

  /geos/feature/site-characterisation:
    get:
      tags:
        - Geo module
      summary: get site characterisation
      responses:
        "200":
          content:
            application/x-ndjson:
              schema:
                $ref: "#/components/schemas/SiteCharacterisationLine"
          description: >-
            A stream of newline-delimited JSON objects, NOT a single JSON
            document. One object per line, each a `SiteCharacterisationLine`.
            The response is chunked and the status is 200 from the moment the
            first line is written, so a component that fails afterwards cannot
            change it: read `end` to know the run completed.
        "400":
          $ref: "#/components/responses/Bad Request"
        "500":
          $ref: "#/components/responses/Internal Server Error"
      parameters:
        - $ref: "#/components/parameters/session_id"
        - name: process
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: >-
            re-run only these components, naming them exactly as `process`
            appears on the line to replace. Repeat the parameter for several.
            Omit it to run everything, which is what a first load does.

            This is the retry path. For one card there is nothing to build:
            the line carries `error_status.retry_url` ready to request. Build
            this parameter yourself only for "retry all failed", where several
            components should go in ONE request rather than one each -- they
            then share a single run instead of queueing behind each other.

            Components that the requested ones depend on are re-run
            automatically but are NOT re-emitted, so a retry never overwrites
            a card the client already holds. An unrecognised name is a 400.
        - name: error_test
          in: query
          required: false
          schema:
            type: string
            enum:
              - api
              - stream
              - data
          description: >-
            MAKE THIS ENDPOINT FAIL ON PURPOSE, so the error paths can be built
            and reviewed without waiting for a real outage. Omit it for normal
            behaviour. Every synthetic message begins "SIMULATED" and says
            which mode produced it, so one can never be mistaken for a real
            failure in a screenshot or a log.

            `api` -- the request fails before the stream opens: 500 with the
            ordinary JSON error body and no NDJSON at all. The only failure
            that can still be expressed as an HTTP status.

            `stream` -- the stream opens, sends four lines, then stops WITHOUT
            `end`, exactly as a dropped connection would. The status went 200
            with the first line, so a client that only checks the status will
            treat a truncated run as a complete one; this is how to prove it
            checks for `end` instead.

            `data` -- a real, complete run whose lines are given synthetic
            `error_status` values, cycling through the four shapes a card has
            to draw: `partial` with no data (a crash), `partial` with data
            (incomplete I/O), `failed` (this is the answer), and clean.
            Payloads stay real except for the crash case, whose `data` is
            emptied because that is what a real one carries. The `retry_url`
            on the retryable lines is a normal one, so following it performs a
            genuine retry that succeeds.

            Combine with `process` to keep the rehearsal fast: a few cheap
            components return in a second or two rather than the whole run.

            An unrecognised value is a 400, so a typo cannot silently return a
            healthy stream and look like the error path is broken.
      description: >-
        Stream the full F02-P2 site characterisation for a session: General
        (1.1-1.8), Nature (2.1, 2.2, 2.3, 2.5, 2.6 and endangered trees),
        Climate (3.1-3.6 plus burned area) and People (6.1-6.3) as one NDJSON
        response.


        The first line is always `preparation` and carries the whole plan in
        `data.processes`, so a client knows every step and its relative cost
        before any work lands. Each following line is one component's slice of
        the payload, in the fixed order of that plan. The last line is always
        `end`, with empty `data` and a null `next`.


        Merge every line's `data` (skipping `preparation` and `end`) to build
        the complete result object. General, Nature and Climate send FLAT
        objects whose keys never collide, so a shallow merge is enough for
        those. People sends objects keyed by SECTION -- `social_demography`,
        `employment`, `education`, `economy`, `health`, `housing_settlements`
        -- and three of its components all write into `social_demography`, so
        People's lines must be merged one level deeper.


        The People payload is PER COUNTRY: which sections and fields arrive
        depends on which country the project area falls in, because each
        national statistics office publishes different indicators. A field the
        country has no data for is absent or null, never zero.


        A component that fails emits its line with `data: {}` rather than
        taking down the response, so a partial result is normal and expected.
        Every line carries `error_status`, null when the component ran clean.
        It answers the one question a client cannot otherwise settle, since a
        crash, a degraded number and absent data all arrive carrying nulls and
        the status has been 200 since the first line: IS IT WORTH ASKING
        AGAIN. `partial` means yes, `failed` means no.


        A retry uses THIS SAME ENDPOINT with `process` (see the parameter), and
        the response has the same shape -- `preparation` with the plan for that
        run, one line per component, `end` -- so no second parser is needed and
        `w`/`a` drive the retry's own progress bar.
      operationId: getSiteCharacterisation

