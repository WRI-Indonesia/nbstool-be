openapi: 3.1.0
servers:
  - url: http://someserversurl.com
    description: base url
components:
  schemas:
    User:
      type: object
      required:
        - id
        - email
        - name
        - is_active
        - permission_policy
        - organization_name
        - organization_type_id
      properties:
        id:
          type: integer
          examples:
            - 1
        email:
          type: string
          examples:
            - user@mail.com
        name:
          type: string
          examples:
            - John Doe
        is_active:
          type: boolean
        permission_policy:
          type: integer
          examples:
            - 1
        organization_name:
          type: string
          examples:
            - My Organization
        organization_type_id:
          type: integer
          examples:
            - 1
      description: user account model
    UserProfile:
      type: object
      required:
        - name
        - email
        - organization_type_id
        - organization_name
        - permission_policy
      properties:
        name:
          type: string
          examples:
            - John Doe
        email:
          type: string
          examples:
            - user@mail.com
        organization_type_id:
          type: integer
          examples:
            - 1
        organization_name:
          type: string
          examples:
            - My Organization
        permission_policy:
          type: integer
          examples:
            - 1
        avatar:
          type: string
          description: base64-encoded avatar image
          examples:
            - /9j/4AAQSkZJRgABA...
        extended_data:
          type: object
      description: user profile with avatar
    Geometry:
      type: object
      required:
        - coordinates
        - type
      properties:
        type:
          type: string
          examples:
            - Point
            - Polygon
            - MultiPolygon
        coordinates:
          type: array
          items:
            type: number
            format: float
            examples:
              - 103.87751306931531
      description: GeoJSON geometry object
    PolygonResult:
      type: object
      required:
        - session_id
        - area_size
        - user_limit
        - exceed_size
      properties:
        session_id:
          type: string
          examples:
            - b06e52c5-694d-4890-9a0e-ae9e4a581da5
        area_size:
          type: number
          examples:
            - 22.55
        user_limit:
          type: number
          examples:
            - 100000.0
        exceed_size:
          type: boolean
        country:
          type: string
          examples:
            - indonesia
      description: result of polygon creation or update
    MapExplorer:
      type: object
      required:
        - session_id
        - project_duration
        - estimated_unplanned_deforestation
        - rest_target
        - intervention
      properties:
        session_id:
          type: string
          examples:
            - b06e52c5-694d-4890-9a0e-ae9e4a581da5
        project_duration:
          type: integer
          examples:
            - 30
        estimated_unplanned_deforestation:
          type: number
          examples:
            - 5.5
        rest_target:
          type: object
        intervention:
          type: array
          items:
            type: string
            examples:
              - Avoided deforestation
      description: map explorer configuration
    Location:
      type: object
      required:
        - location_value
        - location_name
        - location_type
      properties:
        location_value:
          type: string
          examples:
            - borneo
        location_name:
          type: string
          examples:
            - Borneo
        location_type:
          type: string
          examples:
            - island
      description: location search result
    LayerGroup:
      type: object
      required:
        - title
        - order_no
        - group_image
        - items
      properties:
        title:
          type: string
          examples:
            - Biodiversity
        order_no:
          type: integer
          examples:
            - 1
        group_image:
          type: string
          examples:
            - biodiversity.png
        items:
          type: array
          items:
            $ref: "#/components/schemas/Layer"
      description: a grouped collection of map layers
    Layer:
      type: object
      required:
        - id
        - name
        - url
        - service
      properties:
        id:
          type: integer
          examples:
            - 1
        name:
          type: string
          examples:
            - Key Biodiversity Areas
        url:
          type: string
          examples:
            - https://tiles.mapservice.com/layer/{z}/{x}/{y}
        service:
          type: string
          examples:
            - WMS
        version:
          type: string
          examples:
            - "1.1.1"
        layers:
          type: string
          examples:
            - kba
        srs:
          type: string
          examples:
            - EPSG:4326
        styles:
          type: string
        format:
          type: string
          examples:
            - image/png
        source:
          type: string
        citation:
          type: string
        description:
          type: string
        disclaimer:
          type: string
        spatial_resolution:
          type: string
          examples:
            - 30m
      description: a single map layer
    ProjectSummary:
      type: object
      required:
        - project_id
        - project_name
        - aoi_country
        - aoi_province
        - aoi_area
      properties:
        project_id:
          type: string
          examples:
            - c6276049-3d5f-4396-933a-a0318b2b2e09
        project_name:
          type: string
          examples:
            - My NBS Project
        aoi_country:
          type: string
          examples:
            - Indonesia
        aoi_province:
          type: string
          examples:
            - Kalimantan Tengah
        aoi_area:
          type: number
          examples:
            - 22.55
      description: project list item
    ProjectDetails:
      type: object
      required:
        - polygon
        - project_name
        - project_area
        - area_of_interest
        - project_duration
        - intervention_type
        - estimated_unplanned_deforestation
        - restoration_target
      properties:
        polygon:
          $ref: "#/components/schemas/Geometry"
        project_name:
          type: string
          examples:
            - My NBS Project
        project_area:
          type: number
          examples:
            - 22.55
        area_of_interest:
          type: string
          examples:
            - Borneo, Indonesia
        project_duration:
          type: integer
          examples:
            - 30
        intervention_type:
          type: array
          items:
            type: string
            examples:
              - Avoided deforestation
        estimated_unplanned_deforestation:
          type: number
          examples:
            - 5.5
        restoration_target:
          type: object
      description: detailed project information
    Document:
      type: object
      required:
        - document_id
        - document_type
        - document_status
        - document_name
        - project_id
      properties:
        document_id:
          type: string
          examples:
            - d1234567-89ab-cdef-0123-456789abcdef
        document_type:
          type: string
          enum:
            - General
            - CCB
          examples:
            - General
        document_status:
          type: string
          examples:
            - Draft
        document_name:
          type: string
          examples:
            - feasibility_report.docx
        project_id:
          type: string
          examples:
            - c6276049-3d5f-4396-933a-a0318b2b2e09
      description: project document record
    CcbDocument:
      type: object
      required:
        - session_id
      properties:
        session_id:
          type: string
          examples:
            - b06e52c5-694d-4890-9a0e-ae9e4a581da5
        section_1:
          type: object
        section_2:
          type: object
        section_3:
          type: object
        section_4:
          type: object
        section_5:
          type: object
      description: CCB document with up to 5 sections
    Organization:
      type: object
      required:
        - id
        - name
        - is_active
      properties:
        id:
          type: integer
          examples:
            - 1
        name:
          type: string
          examples:
            - NGO
        is_active:
          type: integer
          enum:
            - 0
            - 1
          examples:
            - 1
      description: organization type
    Faq:
      type: object
      required:
        - faq_id
        - group_id
        - group_name
        - question
        - answer
      properties:
        faq_id:
          type: integer
          examples:
            - 1
        group_id:
          type: integer
          examples:
            - 1
        group_name:
          type: string
          examples:
            - General
        question:
          type: string
          examples:
            - What is NBS?
        answer:
          type: string
          examples:
            - Nature-Based Solutions are actions to protect, restore, and sustainably manage ecosystems.
      description: FAQ item
    Dictionary:
      type: object
      required:
        - id
        - code
        - name
        - type
      properties:
        id:
          type: integer
          examples:
            - 1
        code:
          type: string
          examples:
            - LOG_SUCCESS
        name:
          type: string
          examples:
            - Success
        type:
          type: string
          examples:
            - log_type
        description:
          type: string
          examples:
            - Successful operation log
      description: master dictionary entry
    Log:
      type: object
      required:
        - id
        - log_type_code
        - activity_type_code
        - session_id
        - created_at
      properties:
        id:
          type: integer
          examples:
            - 1
        log_type_code:
          type: string
          examples:
            - LOG_SUCCESS
        log_type_name:
          type: string
          examples:
            - Success
        activity_type_code:
          type: string
          examples:
            - feature_input_polygon
        activity_type_name:
          type: string
          examples:
            - Input Polygon
        description:
          type: string
          examples:
            - User drew a polygon
        session_id:
          type: string
          examples:
            - b06e52c5-694d-4890-9a0e-ae9e4a581da5
        created_at:
          type: string
          examples:
            - 2025-10-12T11:01:55.359868
        created_by:
          type: integer
          examples:
            - 1
      description: activity log entry
    ThreatLine:
      type: object
      description: >-
        One line of the threat stream. Identical envelope to
        `SiteCharacterisationLine`; only `process` and `data` differ.
      properties:
        process:
          type: string
          enum: [preparation, all ecosystems, dryland forest, mangrove, peatland, end]
          description: >-
            which tab this line fills. `all ecosystems` is the Overview tab,
            `dryland forest` is the Forest tab.
        data:
          description: >-
            the section payload -- ThreatOverview, ThreatForest,
            ThreatMangrove or ThreatPeatland by `process`. `{}` on
            `preparation` (which carries the plan) and on `end`.
          oneOf:
            - $ref: "#/components/schemas/ThreatOverview"
            - $ref: "#/components/schemas/ThreatForest"
            - $ref: "#/components/schemas/ThreatMangrove"
            - $ref: "#/components/schemas/ThreatPeatland"
        error_status:
          type:
            - object
            - "null"
          description: >-
            EXACTLY the `error_status` of `SiteCharacterisationLine` -- same
            two states (`partial` = retryable, `failed` = this is the answer),
            same `retryable`, `retry_url` and `messages` fields. Null when the
            section ran clean. Handle it with the code that already reads the
            characterisation stream.
        w: {type: number, description: total weight of this run}
        a: {type: number, description: weight of this line}
        next: {type: string, nullable: true}

    ThreatOverview:
      type: object
      description: the Overview tab. Screening summary across all three ecosystems.
      properties:
        total_ecosystem_area_ha:
          type: number
          description: >-
            the three ecosystems combined, and the denominator for
            `percentage_total`. NOT the project area: land that is none of the
            three is simply not counted, and that shortfall shows up in
            `total_ecosystem_percentage`.

            THIS TAB CARRIES NO DISTURBED FIGURES. Section 3.1 measures
            disturbance as `ecosystem AND disturbed`, while the three
            per-ecosystem tabs measure `ecosystem AND still-forest AND
            disturbed` -- on the data team's own run those differ by up to
            2600x for the same ecosystem. THE PER-TAB DEFINITION IS THE ONE TO
            DISPLAY -- confirmed by the data team 2026-08-19 -- so fill each
            card's disturbed figure, and the "Total Disturbed area" headline,
            by summing the `dryland forest`, `mangrove` and `peatland` lines
            when they arrive. Overview is not
            made to wait for them: it is the landing tab and the cheapest
            section.

            The Peat forest / Peat non-forest split bar comes from the same
            place -- the `peatland` line's `remaining_forest_ha` against its
            `total_area_ha`.
        total_ecosystem_percentage:
          type: number
          description: total ecosystem area as a share of the PROJECT area.
        ecosystems:
          type: array
          description: always three, in the order Dryland, Mangrove, Peatland.
          items:
            $ref: "#/components/schemas/ThreatEcosystemSummary"

    ThreatEcosystemSummary:
      type: object
      description: one card on the Overview tab.
      properties:
        ecosystem:
          type: string
          enum: [Dryland, Mangrove, Peatland]
          description: >-
            analysis key. DRYLAND INCLUDES SAVANNA -- the source layer does not
            separate them.
        label:
          type: string
          description: >-
            what the card prints -- "Dryland forest", "Mangrove", "Peatland".
            Differs from `ecosystem` for Dryland: the source layer calls the
            class "Dryland", the design calls the card "Dryland forest".
        area_ha: {type: number}
        percentage_total:
          type: number
          description: >-
            share of `total_ecosystem_area_ha`. The three ALWAYS sum to 100 --
            only three classes are screened and there is no residual class.

    ThreatDrivers:
      type: object
      description: >-
        What is driving the disturbance, in the three groups the design shows.
        PRESENCE ONLY -- each list is driver names that occur in the AOI, with
        no area and no ranking, because the source computes none.
      properties:
        non_natural:
          type: array
          items: {type: string}
          description: >-
            human-caused. Dryland vocabulary: Small-scale agriculture,
            Small-scale agriculture (fire), Large-scale agriculture,
            Large-scale agriculture (fire), Road development, Selective
            logging, Mining. Mangrove vocabulary: Commodities, Settlement.
        natural:
          type: array
          items: {type: string}
          description: >-
            Flooding, Forest fire, Landslide, Extreme climate event. The design
            also lists Drought and Typhoon; no layer supplies them today.
        other:
          type: array
          items: {type: string}
          description: Non-productive conversion, Unknown.

    ThreatForest:
      type: object
      description: the Forest tab. Dryland forest, which includes savanna.
      properties:
        total_area_ha: {type: number}
        remaining_forest_ha: {type: number}
        remaining_forest_percentage: {type: number}
        disturbed_area_ha: {type: number}
        disturbed_percentage: {type: number}
        forest_loss_ha: {type: number}
        forest_loss_percentage: {type: number}
        forest_gain_ha: {type: number}
        forest_gain_percentage: {type: number}
        period:
          type: object
          description: the years the disturbance record covers, for the narrative.
          properties:
            from: {type: integer}
            to: {type: integer}
        drivers:
          $ref: "#/components/schemas/ThreatDrivers"

    ThreatMangrove:
      type: object
      description: the Mangrove tab.
      properties:
        total_area_ha: {type: number}
        remaining_forest_ha: {type: number}
        remaining_forest_percentage: {type: number}
        disturbed_area_ha: {type: number}
        disturbed_percentage: {type: number}
        main_pressure:
          type: string
          enum: [Commodities, Settlement, Commodities and Settlement, Not identified]
          description: >-
            the headline driver the card prints -- the larger of Commodities and
            Settlement BY AREA, both when they tie above zero, and the literal
            string "Not identified" (never null) when neither occurs. This is
            the only place in F02-P3 that ranks drivers by area; the Forest tab
            has no equivalent.
        period:
          type: object
          properties:
            from: {type: integer}
            to: {type: integer}
        drivers:
          $ref: "#/components/schemas/ThreatDrivers"

    ThreatPeatland:
      type: object
      description: >-
        the Peatland tab. Note this tab reports CONVERTED / LOSS where the
        Forest tab reports forest loss and gain, and replaces the driver lists
        with three hydrological indicators.
      properties:
        total_area_ha: {type: number}
        remaining_forest_ha: {type: number}
        remaining_forest_percentage: {type: number}
        disturbed_area_ha: {type: number}
        disturbed_percentage: {type: number}
        converted_loss_ha: {type: number}
        converted_loss_percentage: {type: number}
        canal_proximity:
          type: string
          enum: [High, Medium, Low, Not identified]
          description: >-
            from `canal_distance_m`: High at or under 500 m, Medium to 1 km, Low
            beyond. "Not identified" when the AOI holds no current peat forest
            to measure from; "Low" also covers the case where no canal is found
            at all.
        canal_distance_m:
          type: number
          nullable: true
          description: >-
            metres to the nearest drainage canal, INCLUDING canals outside the
            project boundary -- they influence the water table up to 500 m and
            biomass growth up to 1 km, which is where the grades above come
            from. Null whenever no distance could be measured, including the
            "Low, no canal found" case. Measured as a VECTOR distance in the
            AOI's own UTM zone, not a raster one.
        drainage_pressure:
          type: string
          enum: [High, Medium, Low, Not identified]
          description: >-
            highest canal-density class present in the peatland, from
            `peat_canals_density_v3.tif` (3 High, 2 Medium, 1 Low).
        fire_risk:
          type: string
          enum: [High, Medium, Low, Very low, No risk]
          description: >-
            highest fire-risk class present in the peatland. FIVE levels, not
            three -- wider than the other two indicators.

    PathwaySelection:
      type: object
      description: >-
        The Pathway Selection payload. `ecosystems` always has exactly three
        entries in the order Dryland, Mangrove, Peatland, whether or not the
        AOI contains them, so the screen keeps its shape on every site; check
        `present` rather than the array length.
      properties:
        project_area_ha:
          type: number
          description: total AOI area, the denominator for `total_area_percentage`.
        applicable:
          type: boolean
          description: >-
            false when the pathway layer does not reach this AOI at all. Every
            card is then empty and `messages` says why.
        eligible_area_ha:
          type: number
          description: area qualifying for any NBS pathway, across all ecosystems.
        eligible_percentage:
          type: number
        unclassified_area_ha:
          type: number
          description: >-
            area with no pathway value: outside the layer, or carrying a
            category with no reference ecosystem. Not attributed to any card.
        unclassified_percentage:
          type: number
        ecosystems:
          type: array
          items:
            $ref: "#/components/schemas/PathwayEcosystem"
        duration_years:
          type: object
          description: >-
            bounds and default for the intervention duration slider. Product
            constants, served so the frontend does not hardcode numbers the
            backend will later be asked to honour.
          properties:
            default: {type: integer}
            min: {type: integer}
            max: {type: integer}
            step: {type: integer}
        carbon_risk:
          type: object
          description: >-
            default deductions for the Net ERR calculation, in percent. The
            user may override all three on this screen.
          properties:
            leakage_percentage: {type: number}
            uncertainty_percentage: {type: number}
            buffer_percentage: {type: number}
        messages:
          type: array
          items:
            type: string
          description: >-
            everything the three components flagged, in one list -- a savanna
            fold, a category with no catalog row, a layer that does not cover
            the site. Usually empty. There is no per-card error slot, so these
            belong above the cards or nowhere.

    PathwayEcosystem:
      type: object
      description: one ecosystem card.
      properties:
        ecosystem:
          type: string
          enum: [Dryland, Mangrove, Peatland]
          description: the analysis key. Savanna is folded into Dryland.
        label:
          type: string
          description: >-
            what the card prints. Dryland is shown as "Forest"; the other two
            match their key.
        present:
          type: boolean
          description: false when the AOI contains none of this ecosystem. Every number is then 0.
        total_area_ha:
          type: number
        total_area_percentage:
          type: number
          description: share of the PROJECT area -- "40% of total area".
        disturbed_area_ha:
          type: number
          description: >-
            ALWAYS 0 TODAY. Disturbance belongs to F02-P3 Threat profile and is
            not wired into this endpoint yet; nothing in the pathway analysis
            measures it. The key exists so the contract does not change when
            P3 fills it. Do not present it as a finding until it is non-zero.
        disturbed_percentage:
          type: number
          description: >-
            ALWAYS 0 TODAY, see `disturbed_area_ha`. Will be the share of THIS
            ECOSYSTEM -- "25% of forest is disturbed".
        is_disturbed:
          type: boolean
          description: >-
            ALWAYS false today. Will drive the DISTURBED / NON-DISTURBED badge
            once F02-P3 supplies the figure.
        interventions:
          type: array
          description: >-
            always exactly three, in the order Protect, Manage, Restore. THEY
            PARTITION THE ECOSYSTEM: every pixel carries exactly one pathway,
            so the three areas plus `ineligible_area_ha` sum to
            `total_area_ha` and the three percentages sum to at most 100. They
            are not overlapping eligibilities and cannot exceed 100 together.
          items:
            $ref: "#/components/schemas/PathwayIntervention"
        ineligible_area_ha:
          type: number
          description: >-
            the rest of the ecosystem: real area on which no intervention can
            be selected. Not a fourth toggle.
        ineligible_percentage:
          type: number

    PathwayIntervention:
      type: object
      properties:
        intervention:
          type: string
          enum: [Protect, Manage, Restore]
        area_ha:
          type: number
        percentage:
          type: number
          description: share of the ecosystem -- "70% of forest is eligible to protect".
        eligible:
          type: boolean
          description: >-
            false when this ecosystem has no area under this pathway. Render
            the toggle disabled and the card as "Non-eligible"; `area_ha` is
            then 0 and `activities` empty.
        activities:
          type: array
          description: >-
            the checkboxes under this intervention, deduplicated and largest
            category first. Several categories can share one activity; it is
            listed once.
          items:
            type: object
            properties:
              activity_id: {type: string}
              activity: {type: string}

    SiteCharacterisationLine:
      type: object
      required:
        - process
        - data
        - error_status
        - w
        - a
        - next
      properties:
        process:
          type: string
          description: >-
            which step this line carries. `preparation` first, `end` last,
            one component in between. This is also the value to send back as
            `process` to re-run just this component.
          examples:
            - ecosystem type
            - soil classification
        data:
          type: object
          description: >-
            the component's slice of the payload. On `preparation` this is
            `{"processes": [...]}`, the plan. On `end` it is empty. On a
            component that failed it is also empty -- read `error_status` to
            tell that apart from a component that ran and had nothing to
            report.
          examples:
            - flii_score: 2.78
        error_status:
          type:
            - object
            - "null"
          description: >-
            null when the component ran clean, which is the normal case and
            includes both bookends. Otherwise it says what went wrong and
            whether asking again could change the answer.
          required:
            - state
            - retryable
            - retry_url
            - messages
          properties:
            state:
              type: string
              enum:
                - partial
                - failed
              description: >-
                THE STATE IS THE RETRYABILITY. These are instructions to the
                client, not descriptions of what happened, and they do not
                line up with intuition -- read them as verbs.

                `partial` -- ASKING AGAIN COULD CHANGE THE ANSWER. Offer the
                retry. This covers a component that crashed (which carries no
                `data` at all, despite the name) and one whose I/O partly
                failed, such as four species rasters out of 236 that could not
                be read.

                `failed` -- THIS IS THE ANSWER. Asking again returns exactly
                the same thing, so never offer a retry. This covers a number
                that is permanently degraded, such as a raster covering 40% of
                the area, and data that simply does not exist: the country
                publishes no such table, the statistics office has no row for
                this province, the layer does not reach this AOI. Those are
                not faults, and the field will stay null.

                A crashed component therefore reports `partial`, because on
                this endpoint a crash is almost always the network and a retry
                is the right move. `state` and `retryable` are computed from
                one another and can never disagree.
            retryable:
              type: boolean
              description: >-
                exactly `state == "partial"`, and kept only because it is
                the value the backend actually computes. A client should act
                on `retry_url` and can ignore both this and `state`.
            retry_url:
              type:
                - string
                - "null"
              description: >-
                a ready-made relative URL that re-runs THIS COMPONENT ALONE,
                present exactly when `retryable` is true and null otherwise.
                DRAW THE RETRY BUTTON ON THIS FIELD -- if it is null there is
                nothing useful to retry.

                It is a PATH, not an absolute URL, because an absolute one
                would depend on proxy headers being configured. RESOLVE IT
                AGAINST THE URL YOU REQUESTED THE STREAM FROM -- in a browser
                `new URL(retry_url, streamUrl)` -- rather than against the
                site root, so any reverse-proxy prefix is preserved. The
                response is the identical NDJSON format, just shorter.

                For "retry all failed", do NOT fire these one by one. Collect
                the `process` value of each failed line and send a single
                request with one `process` parameter per component -- they
                then share one run instead of queueing behind each other.
              examples:
                - >-
                  /geos/feature/site-characterisation?session_id=abc&process=habitat+area
            messages:
              type: array
              items:
                type: string
              description: >-
                the component's own account of what happened, naming the layer
                or table concerned. Safe to display. Exception text is reduced
                to its type on purpose, because the full message can carry
                internal URLs and connection strings.
          examples:
            - state: partial
              retryable: true
              retry_url: >-
                /geos/feature/site-characterisation?session_id=abc&process=habitat+area
              messages:
                - >-
                  2.3: 4 of 236 candidate species rasters could not be read,
                  so their species are missing from the counts.
        w:
          type: number
          description: total weight of the whole run, constant on every line
          examples:
            - 22.4
        a:
          type: number
          description: >-
            this step's share of `w`, so a progress bar advances by cost
            rather than by step count
          examples:
            - 1.5
        next:
          type:
            - string
            - "null"
          description: the name of the following step; null on `end`
          examples:
            - administrative boundaries
      description: one line of the site characterisation NDJSON stream
    FailedResponse:
      type: object
      required:
        - stack
        - trace
        - success
        - error
      properties:
        error:
          $ref: "#/components/schemas/FailedErrorEnum"
        stack:
          type: array
          items:
            $ref: "#/components/schemas/FailedErrorStack"
        trace:
          type: string
          examples:
            - please provide json data
        success:
          type: boolean
      description: base model for failed requests
    FailedErrorEnum:
      type: object
      required:
        - code
        - message
      properties:
        code:
          enum:
            - ERR_VALIDATION
            - ERR_UNAUTHORIZED
            - ERR_FORBIDDEN
            - ERR_NOT_FOUND
            - ERR_INTERNAL
          type: string
          examples:
            - ERR_VALIDATION
        message:
          enum:
            - Invalid input data
            - Unauthorized
            - Forbidden
            - Resource not found
            - Internal server error
          type: string
          examples:
            - Invalid input data
      description: error enum for failed responses
    FailedErrorStack:
      type: object
      required:
        - message
        - field
        - row
      properties:
        row:
          type: number
          examples:
            - 0
        field:
          type: string
          examples:
            - session_id
        message:
          type: string
          examples:
            - session_id is required
      description: error stack entry for failed requests
  responses:
    No Auth:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FailedResponse"
      description: The server encountered the client's request to an API that lacks valid
        authentication credentials. This specifically means that the API key
        provided is either missing, invalid, or does not grant the necessary
        permissions to access the requested resource.
    Bad Request:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FailedResponse"
      description: The server could not understand the request due to invalid syntax.
        The client should modify the request and try again.
    Internal Server Error:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FailedResponse"
      description: The server encountered an unexpected condition that prevented it
        from fulfilling the request. Report the issue to the support team if it
        persists.
  parameters:
    id:
      in: query
      name: id
      style: form
      schema:
        type: string
        examples:
          - c6276049-3d5f-4396-933a-a0318b2b2e09
      explode: true
      required: false
      description: "record id, sample: `c6276049-3d5f-4396-933a-a0318b2b2e09`"
      allowReserved: false
    session_id:
      in: query
      name: session_id
      style: form
      schema:
        type: string
        examples:
          - b06e52c5-694d-4890-9a0e-ae9e4a581da5
      explode: true
      required: true
      description: active session identifier
      allowReserved: false
    project_id:
      in: query
      name: project_id
      style: form
      schema:
        type: string
        examples:
          - c6276049-3d5f-4396-933a-a0318b2b2e09
      explode: true
      required: true
      description: project identifier
      allowReserved: false
    document_id:
      in: query
      name: document_id
      style: form
      schema:
        type: string
        examples:
          - d1234567-89ab-cdef-0123-456789abcdef
      explode: true
      required: true
      description: document identifier
      allowReserved: false
    keywords:
      in: query
      name: keywords
      style: form
      schema:
        type: string
        examples:
          - search term
      explode: true
      description: text string to search
      allowReserved: false
      allowEmptyValue: true
    search_by:
      in: query
      name: search_by
      style: form
      schema:
        type: string
        examples:
          - name
      explode: true
      description: field name to search on
      allowReserved: false
      allowEmptyValue: true
    page_index:
      in: query
      name: page_index
      style: form
      schema:
        type: integer
        examples:
          - 0
      explode: true
      required: false
      description: zero-based page index for pagination
      allowReserved: false
    page_size:
      in: query
      name: page_size
      style: form
      schema:
        type: integer
        examples:
          - 10
      explode: true
      required: false
      description: number of records per page
      allowReserved: false
  securitySchemes:
    Authorization:
      in: header
      name: Authorization
      type: apiKey
      description: 'Bearer token auth: include a valid JWT in the `"Authorization"` header.
        Format: `Bearer <token>`'
