      summary: get feasibility form draft
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                title: GetFeasibilityV3FormOk
                required:
                  - result
                properties:
                  result:
                    type: object
                    required:
                      - form
                      - user_input
                    properties:
                      form:
                        type: object
                        description: >-
                          stored draft merged over the analyser prefill.
                          Stored answers win, including deliberate blanks;
                          prefill only fills fields never saved.
                        examples:
                          - seHouseholds: 13000
                            seIncome: 3200000
                      user_input:
                        type: object
          description: Success
        "400":
          $ref: "#/components/responses/Bad Request"
        "500":
          $ref: "#/components/responses/Internal Server Error"
      parameters:
        - $ref: "#/components/parameters/session_id"
      description: >-
        F03. The feasibility form draft for a session: what the form should
        show on load. Some fields arrive pre-filled from the analyser where a
        regional figure is an honest starting point (household count, average
        household income); the user is expected to correct them from local
        knowledge.
      operationId: getFeasibilityV3Form
    post:
      tags:
        - Document module
      summary: save feasibility form draft
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                title: SaveFeasibilityV3FormOk
                required:
                  - result
                properties:
                  result:
                    type: object
                    required:
                      - message
                    properties:
                      message:
                        type: string
                        examples:
                          - saved
          description: Success
        "400":
          $ref: "#/components/responses/Bad Request"
        "500":
          $ref: "#/components/responses/Internal Server Error"
      parameters: []
      description: >-
        F03. Upsert the feasibility form draft -- both save-draft and next hit
        this, sending ONLY the keys they touched. Keys merge into what is
        already stored, so a partial save never wipes another step's answers;
        send an explicit null to clear one answer.
      operationId: saveFeasibilityV3Form
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - session_id
              properties:
                session_id:
                  type: string
                  examples:
                    - b06e52c5-694d-4890-9a0e-ae9e4a581da5
                form:
                  type: object
                  description: F03 socio-economic answers to merge in (se* keys)
                  examples:
                    - seHouseholds: "3140"
                      seDiseases: dengue, malaria
                user_input:
                  type: object
                  description: template-tag overrides to merge in
        required: true

