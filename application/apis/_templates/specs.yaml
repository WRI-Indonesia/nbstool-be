info:
  title: NBS Backend API Docs
  version: 0.0.0
  description: >-
    Welcome to the **NBS Backend API documentation**. This API provides a
    simple, secure, and efficient way to interact with the **Nature-Based
    Solutions platform's data, services, and tools**.

    Designed for developers, system integrators, and partners, our API enables
    you to automate tasks, integrate with third-party services, and build
    powerful applications on top of the **NBS Backend platform**.
tags:
  - name: User module
    description: The User Module provides all endpoints and operations related to
      user management within the system. It handles user registration,
      authentication, profile management, and access control.
  - name: Geo module
    description: The Geo Module provides all endpoints and operations related to
      geospatial analysis within the system, including polygon management,
      map layers, current condition analysis, and benefit calculations.
  - name: Project module
    description: The Project Module provides all endpoints and operations related to
      project management, including creating, updating, and deleting projects.
  - name: Document module
    description: The Document Module provides all endpoints and operations related to
      document generation and management, including feasibility reports, CCB
      documentation, CSV/XLSX exports, and GeoPDF generation.
  - name: Master module
    description: The Master Module provides all endpoints and operations related to
      master data management, including organizations, FAQ, and dictionary entries.
  - name: Logger module
    description: The Logger Module provides all endpoints and operations related to
      activity logging and user audit trails.
  - name: Incubator module
    description: The Incubator Module provides all endpoints and operations related to
      submitting project documents for incubator review.
paths:
  /users/account/get-token:
    get:
      tags:
        - User module
      summary: get token
      security:
        - Authorization: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                title: GetTokenOk
                required:
                  - access_token
                  - user
                properties:
                  access_token:
                    type: string
                    examples:
                      - eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  user:
                    $ref: "#/components/schemas/User"
          description: Success
        "401":
          $ref: "#/components/responses/No Auth"
        "500":
          $ref: "#/components/responses/Internal Server Error"
      parameters: []
      description: generate authentication token for the currently logged-in user
      operationId: getToken

  /users/account:
    get:
      tags:
        - User module
      summary: get account
      security:
        - Authorization: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
          description: Success
        "401":
          $ref: "#/components/responses/No Auth"
        "500":
          $ref: "#/components/responses/Internal Server Error"
      parameters: []
      description: retrieve authenticated user's profile information
      operationId: getAccount
    post:
      tags:
        - User module
      summary: update account
      security:
        - Authorization: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                title: UpdateAccountOk
                required:
                  - status_code
                  - message
                properties:
                  status_code:
                    type: integer
                    examples:
                      - 200
                  message:
                    type: string
                    examples:
                      - Updated
          description: Success
        "400":
          $ref: "#/components/responses/Bad Request"
        "401":
          $ref: "#/components/responses/No Auth"
        "500":
          $ref: "#/components/responses/Internal Server Error"
      parameters: []
      description: update user profile and avatar image
      operationId: updateAccount
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - data
                - section
              properties:
                data:
                  type: string
                  description: >-
                    JSON string of fields for the chosen section.
                    section=profile: name (mandatory), role, phone, short_bio.
                    section=organization: organization_type_id (mandatory, must
                    exist), organization_name (mandatory), country (mandatory),
                    province, city. Any other section value: permissionPolicy.
                    Saved fields other than name/organization are stored in the
                    user's extended data and returned by GET /users/account.
                  examples:
                    - '{"name":"John Doe","role":"Project Lead","phone":"0812345678","short_bio":"About me"}'
                    - '{"organization_type_id":1,"organization_name":"My Organization","country":"Indonesia","province":"Bali","city":"Denpasar"}'
                section:
                  type: string
                  description: which profile section is being updated
                  examples:
                    - profile
                    - organization
                logo:
                  type: string
                  format: binary
                  description: avatar image file (optional)
        required: true

  /users/account/register:
    post:
      tags:
        - User module
      summary: register
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                title: RegisterOk
                required:
                  - status_code
                  - message
                properties:
                  status_code:
                    type: integer
                    examples:
                      - 201
                  message:
                    type: string
                    examples:
                      - Check email to activate
          description: Success
        "400":
          $ref: "#/components/responses/Bad Request"
        "500":
          $ref: "#/components/responses/Internal Server Error"
      parameters: []
      description: register a new user account; sends an activation email
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - name
                - organizationTypeId
                - organizationName
                - country
              properties:
                email:
                  type: string
                  examples:
                    - user@mail.com
                password:
                  type: string
                  examples:
                    - secret123
                name:
                  type: string
                  examples:
                    - John Doe
                organizationTypeId:
                  type: integer
                  examples:
                    - 1
                organizationName:
                  type: string
                  examples:
                    - My Organization
                country:
                  type: string
                  description: stored title-cased in the user's extended data
                  examples:
                    - Indonesia
        required: true

  /users/account/verification/resend:
    post:
      tags:
        - User module
      summary: resend verification
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                title: ResendVerificationOk
                required:
                  - status_code
                  - message
                properties:
                  status_code:
                    type: integer
                    examples:
                      - 201
                  message:
                    type: string
                    examples:
                      - Activation email sent
          description: Success
        "400":
          $ref: "#/components/responses/Bad Request"
        "500":
          $ref: "#/components/responses/Internal Server Error"
      parameters: []
      description: resend account activation email to a registered but unverified user
      operationId: resendVerification
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  examples:
                    - user@mail.com
        required: true

  /users/account/verification/{token}:
    get:
      tags:
        - User module
      summary: verify account
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                title: VerifyAccountOk
                required:
                  - status_code
                  - message
                properties:
                  status_code:
                    type: integer
                    examples:
                      - 200
                  message:
                    type: string
                    examples:
                      - Account activated successfully!
          description: Success
        "400":
          $ref: "#/components/responses/Bad Request"
        "401":
          content:
            application/json:
              schema:
                type: object
                title: VerifyAccountExpired
                required:
                  - status_code
                  - message
                properties:
                  status_code:
                    type: integer
                    examples:
                      - 401
                  message:
                    type: string
                    examples:
                      - Your verification code is not valid anymore
                  user_email:
                    type: string
                    description: present when the token is expired (not invalid),
                      so the client can offer a resend
                    examples:
                      - user@mail.com
                  status:
                    type: string
                    examples:
                      - fail
          description: Token expired or invalid
        "500":
          $ref: "#/components/responses/Internal Server Error"
      parameters:
        - in: path
          name: token
          schema:
            type: string
          required: true
          description: activation token from the registration email
      description: activate a user account using the token from the activation
        email; an expired token returns 401 with the user's email so the client
        can offer to resend
      operationId: verifyAccount

  /users/account/login:
    post:
      tags:
        - User module
      summary: login
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                title: LoginOk
                required:
                  - access_token
                  - user
                  - session
                properties:
                  access_token:
                    type: string
                    examples:
                      - eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  user:
                    $ref: "#/components/schemas/User"
                  session:
                    type: object
          description: Success
        "400":
          $ref: "#/components/responses/Bad Request"
        "401":
          $ref: "#/components/responses/No Auth"
        "500":
          $ref: "#/components/responses/Internal Server Error"
      parameters: []
      description: authenticate user credentials and return JWT token
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  examples:
                    - user@mail.com
                password:
                  type: string
                  examples:
                    - secret123
        required: true

  /users/account/forgot-password:
    post:
      tags:
        - User module
      summary: forgot password
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                title: ForgotPasswordOk
                required:
                  - status_code
                  - message
                properties:
                  status_code:
                    type: integer
                    examples:
                      - 200
                  message:
                    type: string
                    examples:
                      - Reset link sent to email
          description: Success
        "400":
          $ref: "#/components/responses/Bad Request"
        "500":
          $ref: "#/components/responses/Internal Server Error"
      parameters: []
      description: request a password reset link sent to the user's email
      operationId: forgotPassword
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  examples:
                    - user@mail.com
        required: true

  /users/account/reset-password:
    post:
      tags:
        - User module
      summary: reset password
      security:
        - Authorization: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                title: ResetPasswordOk
                required:
                  - status_code
                  - message
                properties:
                  status_code:
                    type: integer
                    examples:
                      - 200
                  message:
                    type: string
                    examples:
                      - Success
          description: Success
        "400":
          $ref: "#/components/responses/Bad Request"
        "401":
          $ref: "#/components/responses/No Auth"
        "500":
          $ref: "#/components/responses/Internal Server Error"
      parameters: []
      description: reset user password using a valid reset token in the Authorization header
      operationId: resetPassword
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
                  examples:
                    - newSecret123
        required: true

  /users/account/change-password:
    post:
      tags:
        - User module
      summary: change password
      security:
        - Authorization: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                title: ChangePasswordOk
                required:
                  - status_code
                  - message
                properties:
                  status_code:
                    type: integer
                    examples:
                      - 200
                  message:
                    type: string
                    examples:
                      - Password changed successfully
          description: Success
        "400":
          $ref: "#/components/responses/Bad Request"
        "401":
          $ref: "#/components/responses/No Auth"
        "500":
          $ref: "#/components/responses/Internal Server Error"
      parameters: []
      description: change password for the currently logged-in user; requires the
        current password to match before the new one is saved
      operationId: changePassword
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - old_password
                - new_password
              properties:
                old_password:
                  type: string
                  examples:
                    - secret123
                new_password:
                  type: string
                  examples:
                    - newSecret123
        required: true

  /users/ga4-report:
    get:
      tags:
        - User module
      summary: ga4 report
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                title: GA4ReportOk
                properties:
                  scene-coalition:
                    type: object
                  nbs-tools:
                    type: object
          description: Success
        "400":
          $ref: "#/components/responses/Bad Request"
        "500":
          $ref: "#/components/responses/Internal Server Error"
      parameters:
        - in: query
          name: passkey
          style: form
          schema:
            type: string
          explode: true
          required: true
          description: secret passkey for access control
          allowReserved: false
        - in: query
          name: start_date
          style: form
          schema:
            type: string
            examples:
              - 2024-01-01
          explode: true
          required: true
          description: report start date
          allowReserved: false
        - in: query
          name: end_date
          style: form
          schema:
            type: string
            examples:
              - 2024-12-31
          explode: true
          required: true
          description: report end date
          allowReserved: false
      description: get Google Analytics 4 statistics report
      operationId: ga4Report

  /geos/polygon:
    get:
      tags:
        - Geo module
      summary: get polygon
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                title: GetPolygonOk
                required:
                  - result
                properties:
                  result:
                    $ref: "#/components/schemas/Geometry"
          description: Success
        "400":
          $ref: "#/components/responses/Bad Request"
        "500":
          $ref: "#/components/responses/Internal Server Error"
      parameters:
        - $ref: "#/components/parameters/session_id"
      description: retrieve the project polygon GeoJSON geometry for a session
      operationId: getPolygon
    post:
      tags:
        - Geo module
      summary: post polygon
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                title: PostPolygonOk
                required:
                  - result
                properties:
                  result:
                    $ref: "#/components/schemas/PolygonResult"
          description: Success
        "201":
          content:
            application/json:
              schema:
                type: object
                title: PostPolygonCreated
                required:
                  - result
                properties:
                  result:
                    $ref: "#/components/schemas/PolygonResult"
          description: Created
        "400":
          $ref: "#/components/responses/Bad Request"
        "500":
          $ref: "#/components/responses/Internal Server Error"
      parameters: []
      description: create or update the project polygon from a drawn GeoJSON geometry
      operationId: postPolygon
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - geometry
              properties:
                geometry:
                  $ref: "#/components/schemas/Geometry"
                session_id:
                  type: string
                  examples:
                    - b06e52c5-694d-4890-9a0e-ae9e4a581da5
                user_id:
                  type: integer
                  examples:
                    - 1
        required: true

  /geos/map/upload:
    post:
      tags:
        - Geo module
      summary: map upload
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                title: MapUploadOk
                required:
                  - selected_polygon
                properties:
                  selected_polygon:
                    $ref: "#/components/schemas/PolygonResult"
          description: Success
        "400":
          $ref: "#/components/responses/Bad Request"
        "500":
          $ref: "#/components/responses/Internal Server Error"
      parameters: []
      description: upload a ZIP, KML, or KMZ file to define the project area polygon
      operationId: mapUpload
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: ZIP, KML, or KMZ file
                session_id:
                  type: string
                  examples:
                    - b06e52c5-694d-4890-9a0e-ae9e4a581da5
                user_id:
                  type: integer
                  examples:
                    - 1
        required: true

  /geos/map/explorer:
    get:
      tags:
        - Geo module
      summary: get map explorer
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                title: GetMapExplorerOk
                required:
                  - result
                properties:
                  result:
                    $ref: "#/components/schemas/MapExplorer"
          description: Success
        "400":
          $ref: "#/components/responses/Bad Request"
        "500":
          $ref: "#/components/responses/Internal Server Error"
      parameters:
        - $ref: "#/components/parameters/session_id"
      description: retrieve map explorer configuration for a session
      operationId: getMapExplorer
    post:
      tags:
        - Geo module
      summary: post map explorer
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                title: PostMapExplorerOk
                required:
                  - result
                properties:
                  result:
                    type: object
          description: Success
        "201":
          description: Created
        "400":
          $ref: "#/components/responses/Bad Request"
        "500":
          $ref: "#/components/responses/Internal Server Error"
      parameters: []
      description: create or update map explorer configuration (project duration, deforestation estimates, intervention type)
      operationId: postMapExplorer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - session_id
                - project_duration
                - estimated_unplanned_deforestation
                - rest_target
                - intervention
              properties:
                session_id:
                  type: string
                  examples:
                    - b06e52c5-694d-4890-9a0e-ae9e4a581da5
                project_duration:
                  type: integer
                  examples:
                    - 30
                estimated_unplanned_deforestation:
                  type: number
                  examples:
                    - 5.5
                rest_target:
                  type: object
                intervention:
                  type: array
                  items:
                    type: string
                    examples:
                      - Avoided deforestation
        required: true

  /geos/map/location:
    get:
      tags:
        - Geo module
      summary: search location
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Location"
          description: Success
        "400":
          $ref: "#/components/responses/Bad Request"
        "500":
          $ref: "#/components/responses/Internal Server Error"
      parameters:
        - in: query
          name: filter
          style: form
          schema:
            type: string
            examples:
              - Borneo
          explode: true
          required: true
          description: text to search for location names
          allowReserved: false
      description: search locations by name (returns up to 10 results)
      operationId: searchLocation
    post:
      tags:
        - Geo module
      summary: get location coordinates
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                title: GetLocationCoordinatesOk
                required:
                  - selected_location
                properties:
                  selected_location:
                    type: object
                    required:
                      - lat
                      - lng
                    properties:
                      lat:
                        type: number
                        examples:
                          - -0.789275
                      lng:
                        type: number
                        examples:
                          - 113.921327
          description: Success
        "400":
          $ref: "#/components/responses/Bad Request"
        "500":
          $ref: "#/components/responses/Internal Server Error"
      parameters: []
      description: get latitude and longitude coordinates for a given location name
      operationId: getLocationCoordinates
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - location_name
              properties:
                location_name:
                  type: string
                  examples:
                    - Borneo
        required: true

  /geos/layers:
    get:
      tags:
        - Geo module
      summary: get layers
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                title: GetLayersOk
                required:
                  - result
                properties:
                  result:
                    type: array
                    items:
                      $ref: "#/components/schemas/LayerGroup"
          description: Success
        "400":
          $ref: "#/components/responses/Bad Request"
        "500":
          $ref: "#/components/responses/Internal Server Error"
      parameters: []
      description: get all available map layers grouped by category
      operationId: getLayers

  /geos/layers/v2:
    get:
      tags:
        - Geo module
      summary: get layers v2
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                title: GetLayersV2Ok
                required:
                  - result
                properties:
                  result:
                    type: array
                    items:
                      type: object
                      required:
                        - title
                        - order_no
                        - items
                      properties:
                        title:
                          type: string
                          examples:
                            - Biodiversity
                        order_no:
                          type: integer
                          examples:
                            - 1
                        items:
                          type: object
                          properties:
                            country:
                              type: object
                            global:
                              type: array
                              items:
                                $ref: "#/components/schemas/Layer"
          description: Success
        "400":
          $ref: "#/components/responses/Bad Request"
        "500":
          $ref: "#/components/responses/Internal Server Error"
      parameters: []
      description: get hierarchical map layers organized by country and global scope
      operationId: getLayersV2

  /geos/feature/current-condition:
    get:
      tags:
        - Geo module
      summary: get current condition
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                title: GetCurrentConditionOk
                required:
                  - result
                properties:
                  result:
                    type: object
                    description: section analysis data (structure varies by section_type)
          description: Success
        "400":
          $ref: "#/components/responses/Bad Request"
        "500":
          $ref: "#/components/responses/Internal Server Error"
      parameters:
        - $ref: "#/components/parameters/session_id"
        - in: query
          name: section_type
          style: form
          schema:
            type: string
            enum:
              - site_information
              - nature
              - climate
              - people
            examples:
              - site_information
          explode: true
          required: true
          description: the analysis section to retrieve
          allowReserved: false
      description: get current condition analysis results for a specific section
      operationId: getCurrentCondition

  /geos/feature/threat:
    get:
      tags:
        - Geo module
      summary: get threat profile
      responses:
        "200":
          content:
            application/x-ndjson:
              schema:
                $ref: "#/components/schemas/ThreatLine"
          description: >-
            A stream of newline-delimited JSON objects, NOT a single JSON
            document -- the same envelope as
            `/geos/feature/site-characterisation`, so a client parses it with
            the code it already has. Six lines: `preparation`, one per tab,
            then `end`.

            STREAMED RATHER THAN RETURNED WHOLE because the four sections map
            one-to-one onto the four tabs and the user lands on Overview.
            Overview is also the cheapest section (two rasters), so it can be
            drawn while Forest, Mangrove and Peatland are still reading. The
            whole profile touches twelve rasters; a single document would make
            the first tab wait for the last one.
        "400":
          $ref: "#/components/responses/Bad Request"
        "500":
          $ref: "#/components/responses/Internal Server Error"
      parameters:
        - $ref: "#/components/parameters/session_id"
        - name: process
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              enum: [all ecosystems, dryland forest, mangrove, peatland]
          style: form
          explode: true
          description: >-
            re-run only these sections. Same retry contract as
            site-characterisation: a failed line carries
            `error_status.retry_url` ready to request.
      description: >-
        F02-P3 Threat Profile. Where the project area is most disturbed and
        what is driving it, across the three ecosystems.

        ECOSYSTEM BUCKETS ARE NOT THE SAME AS F02-P4's. This endpoint reads
        `threat/ecosystem_v3.tif`, whose Dryland class ALREADY INCLUDES
        SAVANNA -- verified against the pathway raster, where 100% of the
        savanna pixels fall in this layer's Dryland class. Its fourth class is
        `Other` (not an ecosystem), where the pathway raster's fourth class is
        Savanna. So the two layers disagree on totals for the same AOI and
        their areas must not be mixed; see `total_area_ha` below.
      operationId: getThreat

