# build_runner/cloudbuild-beta.yaml
#
# Beta deploy = in-place container swap on the existing prod MIG VMs.
# Never rolls the MIG / recreates VMs — that is the prod pipeline's job.
# Triggered by pushes to the `beta` branch (GitHub trigger, config file mode).
#
# One-time prerequisites (see repo deploy notes):
#   - Reuses the existing PRODUCTION_* Secret Manager secrets; the swap step
#     strips the prefix into an env file (plus PORT=8080) for the container.
#   - Cloud Build SA roles: compute.instanceAdmin.v1, iap.tunnelResourceAccessor,
#     compute.osLogin (or project SSH metadata access), secretmanager.secretAccessor.
#   - IAP TCP forwarding firewall rule (tcp:22 from 35.235.240.0/20) if VMs have
#     no external IPs.
steps:
- name: gcr.io/cloud-builders/docker
  id: build
  args:
    - build
    - '-t'
    - 'gcr.io/$PROJECT_ID/beta-nbs-service:beta'
    - '-t'
    - 'gcr.io/$PROJECT_ID/beta-nbs-service:beta-$SHORT_SHA'
    - '.'

- name: gcr.io/cloud-builders/docker
  id: push
  args:
    - push
    - '--all-tags'
    - 'gcr.io/$PROJECT_ID/beta-nbs-service'

- name: gcr.io/google.com/cloudsdktool/cloud-sdk
  id: swap
  entrypoint: bash
  secretEnv:
    - 'PRODUCTION_SECRET_KEY'
    - 'PRODUCTION_CONFIGURATION_SETUP'
    - 'PRODUCTION_DB_SQLALCHEMY_URI'
    - 'PRODUCTION_GIS_DB_SQLALCHEMY_URI'
    - 'PRODUCTION_MAIL_BREVO_API_KEY'
    - 'PRODUCTION_GCS_BUCKET_NAME'
  args:
    - '-c'
    - |
      set -euo pipefail

      # Container expects unprefixed names (config.py) — strip PRODUCTION_ here,
      # same as the prod template's --container-env mapping does.
      cat > /workspace/app-beta.env <<EOF
      PORT=8080
      SECRET_KEY=$$PRODUCTION_SECRET_KEY
      CONFIGURATION_SETUP=$$PRODUCTION_CONFIGURATION_SETUP
      DB_SQLALCHEMY_URI=$$PRODUCTION_DB_SQLALCHEMY_URI
      GIS_DB_SQLALCHEMY_URI=$$PRODUCTION_GIS_DB_SQLALCHEMY_URI
      MAIL_BREVO_API_KEY=$$PRODUCTION_MAIL_BREVO_API_KEY
      GCS_BUCKET_NAME=$$PRODUCTION_GCS_BUCKET_NAME
      EOF

      IMAGE="gcr.io/$PROJECT_ID/beta-nbs-service:beta-$SHORT_SHA"
      # env file travels inside the SSH command as base64 — stdin is unreliable
      # (gcloud first-run prompts read from it).
      ENV_B64=$(base64 -w0 /workspace/app-beta.env)

      VMS=$(gcloud compute instance-groups managed list-instances ${_MIG_NAME} --zone=${_ZONE} --format="value(instance.basename())")
      echo "instances in ${_MIG_NAME}: $$VMS"
      if [ -z "$$VMS" ]; then
        echo "ERROR: no instances found in MIG ${_MIG_NAME} (zone ${_ZONE})"
        exit 1
      fi

      for VM in $$VMS; do
        echo ">>> swapping beta container on $$VM"
        gcloud compute ssh "$$VM" --zone=${_ZONE} --tunnel-through-iap --quiet --command="
          echo $$ENV_B64 | base64 -d | sudo tee /var/lib/app-beta.env > /dev/null &&
          sudo chmod 600 /var/lib/app-beta.env &&
          sudo docker-credential-gcr configure-docker &&
          sudo docker pull $$IMAGE &&
          (sudo docker rm -f app-beta || true) &&
          sudo docker run -d --name app-beta -p 8081:8080 --restart=always \
            --env-file /var/lib/app-beta.env \
            $$IMAGE
        "
      done

availableSecrets:
  secretManager:
  - versionName: projects/$PROJECT_NUMBER/secrets/PRODUCTION_SECRET_KEY/versions/latest
    env: PRODUCTION_SECRET_KEY
  - versionName: projects/$PROJECT_NUMBER/secrets/PRODUCTION_CONFIGURATION_SETUP/versions/latest
    env: PRODUCTION_CONFIGURATION_SETUP
  - versionName: projects/$PROJECT_NUMBER/secrets/PRODUCTION_DB_SQLALCHEMY_URI/versions/latest
    env: PRODUCTION_DB_SQLALCHEMY_URI
  - versionName: projects/$PROJECT_NUMBER/secrets/PRODUCTION_GIS_DB_SQLALCHEMY_URI/versions/latest
    env: PRODUCTION_GIS_DB_SQLALCHEMY_URI
  - versionName: projects/$PROJECT_NUMBER/secrets/PRODUCTION_MAIL_BREVO_API_KEY/versions/latest
    env: PRODUCTION_MAIL_BREVO_API_KEY
  - versionName: projects/$PROJECT_NUMBER/secrets/PRODUCTION_GCS_BUCKET_NAME/versions/latest
    env: PRODUCTION_GCS_BUCKET_NAME

substitutions:
  _MIG_NAME: production-be-nbs-service
  _ZONE: asia-southeast1-b

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1600s
