# build_runner/cloudbuild-legacy.yaml
#
# Production deploy — static replacement for the GitLab flow where
# config_builder.py generated cloudbuild.yaml per run. GitHub trigger pulls the
# repo directly, so everything the generator injected from GitLab env vars is
# now substitutions / Secret Manager here.
#
# Flow (unchanged from legacy): build image -> push -> create new instance
# template -> MIG rolling update (replacement-method substitute). This RECREATES
# VMs — beta container on each VM comes back via the startup script
# (build_runner/startup-beta.sh) baked into the new template.
#
# Differences from the generated legacy config, on purpose:
#   - template pins the image to :production-$SHORT_SHA (immutable) instead of
#     mutable :production — autohealed VMs always run the fleet's exact build.
#     The :production tag is still pushed for humans/tools.
#   - template name uses $BUILD_ID instead of a random uuid.
steps:
- name: gcr.io/cloud-builders/docker
  id: build
  args:
    - build
    - '-t'
    - 'gcr.io/$PROJECT_ID/production-nbs-service:production'
    - '-t'
    - 'gcr.io/$PROJECT_ID/production-nbs-service:production-$SHORT_SHA'
    - '.'

- name: gcr.io/cloud-builders/docker
  id: push
  args:
    - push
    - '--all-tags'
    - 'gcr.io/$PROJECT_ID/production-nbs-service'

- name: gcr.io/google.com/cloudsdktool/cloud-sdk
  id: deploy
  entrypoint: bash
  secretEnv:
    - 'PRODUCTION_SECRET_KEY'
    - 'PRODUCTION_CONFIGURATION_SETUP'
    - 'PRODUCTION_DB_SQLALCHEMY_URI'
    - 'PRODUCTION_GIS_DB_SQLALCHEMY_URI'
    - 'PRODUCTION_MAIL_BREVO_API_KEY'
    - 'PRODUCTION_GCS_BUCKET_NAME'
  args:
    - '-c'
    - |
      set -euo pipefail

      TEMPLATE="production-be-nbs-service-$BUILD_ID"
      IMAGE="gcr.io/$PROJECT_ID/production-nbs-service:production-$SHORT_SHA"

      gcloud compute instance-templates create-with-container "$$TEMPLATE" \
        --container-image "$$IMAGE" \
        --region asia-southeast1 \
        --machine-type ${_MACHINE_TYPE} \
        --boot-disk-type pd-balanced --boot-disk-size 60GB \
        --tags http-server,https-server,lb-health-check \
        --shielded-integrity-monitoring --shielded-vtpm \
        --scopes default,storage-full,cloud-platform,https://www.googleapis.com/auth/drive \
        --service-account ${_VM_SERVICE_ACCOUNT} \
        --metadata-from-file startup-script=build_runner/startup-beta.sh \
        --container-env "PORT=${_PORT},SECRET_KEY=$$PRODUCTION_SECRET_KEY,CONFIGURATION_SETUP=$$PRODUCTION_CONFIGURATION_SETUP,DB_SQLALCHEMY_URI=$$PRODUCTION_DB_SQLALCHEMY_URI,GIS_DB_SQLALCHEMY_URI=$$PRODUCTION_GIS_DB_SQLALCHEMY_URI,MAIL_BREVO_API_KEY=$$PRODUCTION_MAIL_BREVO_API_KEY,GCS_BUCKET_NAME=$$PRODUCTION_GCS_BUCKET_NAME"

      gcloud compute instance-groups managed rolling-action start-update ${_MIG_NAME} \
        --replacement-method substitute \
        --version "template=$$TEMPLATE" \
        --zone ${_ZONE} \
        --max-unavailable 50%

availableSecrets:
  secretManager:
  - versionName: projects/$PROJECT_NUMBER/secrets/PRODUCTION_SECRET_KEY/versions/latest
    env: PRODUCTION_SECRET_KEY
  - versionName: projects/$PROJECT_NUMBER/secrets/PRODUCTION_CONFIGURATION_SETUP/versions/latest
    env: PRODUCTION_CONFIGURATION_SETUP
  - versionName: projects/$PROJECT_NUMBER/secrets/PRODUCTION_DB_SQLALCHEMY_URI/versions/latest
    env: PRODUCTION_DB_SQLALCHEMY_URI
  - versionName: projects/$PROJECT_NUMBER/secrets/PRODUCTION_GIS_DB_SQLALCHEMY_URI/versions/latest
    env: PRODUCTION_GIS_DB_SQLALCHEMY_URI
  - versionName: projects/$PROJECT_NUMBER/secrets/PRODUCTION_MAIL_BREVO_API_KEY/versions/latest
    env: PRODUCTION_MAIL_BREVO_API_KEY
  - versionName: projects/$PROJECT_NUMBER/secrets/PRODUCTION_GCS_BUCKET_NAME/versions/latest
    env: PRODUCTION_GCS_BUCKET_NAME

substitutions:
  _MIG_NAME: production-be-nbs-service
  _ZONE: asia-southeast1-b
  _MACHINE_TYPE: c2d-highcpu-2
  _PORT: '80'
  _VM_SERVICE_ACCOUNT: 42440379229-compute@developer.gserviceaccount.com

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1600s
